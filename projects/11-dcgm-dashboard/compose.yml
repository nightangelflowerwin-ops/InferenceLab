services:
  fixture-exporter:
    image: python:3.11.11-slim
    working_dir: /lab
    command: ["python", "observability.py", "fixture-exporter", "projects/11-dcgm-dashboard/fixture.prom", "--host", "0.0.0.0"]
    volumes:
      - ../..:/lab:ro
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set a password for this local fixture stack}
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources/inferencelab.yml:ro
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/inferencelab.yml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/inferencelab.json:ro
    ports:
      - "127.0.0.1:3000:3000"
