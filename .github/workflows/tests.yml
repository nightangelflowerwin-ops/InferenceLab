name: Local correctness checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Validate dashboard JavaScript syntax
        run: node --check job_dashboard.js
  cache-services:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.13.6
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for vector service readiness
        run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:6333/readyz', timeout=2) as response:
                      assert response.status == 200
                  break
              except (OSError, AssertionError):
                  time.sleep(1)
          else:
              raise SystemExit('Qdrant did not become ready')
          PY
      - name: Real Redis and Qdrant integration
        env:
          INFERENCELAB_REDIS_PORT: '6379'
          INFERENCELAB_QDRANT_URL: http://127.0.0.1:6333
        run: python -m unittest test_semantic_cache.RealServiceTests -v
  grafana-dashboard:
    runs-on: ubuntu-latest
    services:
      grafana:
        image: grafana/grafana:11.6.1
        env:
          GF_SECURITY_ADMIN_PASSWORD: inference-lab-ephemeral-ci-only
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for Grafana readiness
        run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=2) as response:
                      assert response.status == 200
                  break
              except (OSError, AssertionError):
                  time.sleep(1)
          else:
              raise SystemExit('Grafana did not become ready')
          PY
      - name: Real Grafana dashboard import and readback
        env:
          INFERENCELAB_GRAFANA_URL: http://127.0.0.1:3000
          INFERENCELAB_GRAFANA_PASSWORD: inference-lab-ephemeral-ci-only
        run: python -m unittest test_observability.GrafanaServiceTests -v
      - name: Validate local fixture Compose configuration
        env:
          GRAFANA_PASSWORD: inference-lab-ephemeral-ci-only
        run: docker compose -f projects/11-dcgm-dashboard/compose.yml config --quiet
      - name: Start CPU fixture exporter and Prometheus
        env:
          GRAFANA_PASSWORD: inference-lab-ephemeral-ci-only
        run: docker compose -f projects/11-dcgm-dashboard/compose.yml up -d fixture-exporter prometheus
      - name: Verify actual Prometheus fixture scrape and alert rules
        env:
          GRAFANA_PASSWORD: inference-lab-ephemeral-ci-only
        run: |
          docker compose -f projects/11-dcgm-dashboard/compose.yml exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          python - <<'PY'
          import time, urllib.parse, urllib.request, json
          expressions = ['inference_lab_fixture', 'DCGM_FI_PROF_SM_OCCUPANCY', 'DCGM_FI_PROF_PCIE_TX_BYTES']
          for attempt in range(60):
              try:
                  for expression in expressions:
                      query = urllib.parse.urlencode({'query': expression})
                      with urllib.request.urlopen('http://127.0.0.1:9090/api/v1/query?' + query, timeout=2) as response:
                          result = json.load(response)
                      assert result['status'] == 'success' and result['data']['result']
                      assert result['data']['result'][0]['metric']['source'] == 'fixture'
                  break
              except (OSError, AssertionError):
                  time.sleep(1)
          else:
              raise SystemExit('Fixture metrics were not scraped by Prometheus')
          PY
      - name: Stop fixture stack
        if: always()
        env:
          GRAFANA_PASSWORD: inference-lab-ephemeral-ci-only
        run: docker compose -f projects/11-dcgm-dashboard/compose.yml down
  benchmark-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-report.txt
      - name: Render and inspect three synthetic report charts
        env:
          INFERENCELAB_RENDER_TEST: '1'
          MPLCONFIGDIR: ${{ github.workspace }}/.matplotlib-ci
        run: python -m unittest test_report_render -v
