name: Local correctness checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s . -p "test_*.py" -v
  cache-services:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.13.6
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for vector service readiness
        run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:6333/readyz', timeout=2) as response:
                      assert response.status == 200
                  break
              except (OSError, AssertionError):
                  time.sleep(1)
          else:
              raise SystemExit('Qdrant did not become ready')
          PY
      - name: Real Redis and Qdrant integration
        env:
          INFERENCELAB_REDIS_PORT: '6379'
          INFERENCELAB_QDRANT_URL: http://127.0.0.1:6333
        run: python -m unittest test_semantic_cache.RealServiceTests -v
